name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El runner ubuntu-latest ya trae el SDK de Android (ANDROID_HOME).
      - name: SDK de Android
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Versión
        id: ver
        run: |
          V=$(tr -d ' \r\n' < VERSION)
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Copiar el juego dentro del APK
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets
          cp -r web android/app/src/main/assets/www

      # Lista de archivos con su huella (va dentro del APK): el actualizador de la app compara con la de la
      # última versión publicada y baja solo lo que cambió. Si cambió la parte nativa, baja el APK completo.
      - name: Manifiesto del contenido
        run: python3 .github/scripts/manifiesto.py ${{ github.run_number }} ${{ github.sha }} android/app/src/main/assets/contenido-base.json

      - name: Compilar
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace

      - name: Renombrar
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/${{ steps.ver.outputs.name }}.apk"
          python3 .github/scripts/manifiesto.py --apk "out/${{ steps.ver.outputs.name }}.apk" android/app/src/main/assets/contenido-base.json contenido.json
          git log -1 --pretty=%B | grep -v '^Co-Authored-By\|^Claude-Session' > notas.md
          echo "" >> notas.md
          echo "Instala el archivo \`${{ steps.ver.outputs.name }}.apk\` encima de la versión anterior (desde la 0.2 la app se actualiza sola)." >> notas.md
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.ver.outputs.name }}
          path: out/*.apk

      - name: Publicar versión
        # Solo cuando el repo ya trae los sprites (si no, es una compilación de prueba).
        if: hashFiles('web/assets/sprite/**') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: PokéIsaac Android ${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: |
            out/*.apk
            contenido.json
          make_latest: true
          body_path: notas.md
